# Gives the provided PostgreSQL container a stable name inside the cluster:
# the API connects to "postgres:5432".
#
# This version is for a database that runs OUTSIDE Kubernetes, for example a
# Docker container on the VM itself (published on port 5432). Set the IP
# below to the VM address that container is reachable on from the pods (the
# VM's LAN IP, not 127.0.0.1, which inside a pod is the pod itself).
#
# If the database runs INSIDE the cluster and already has a Service, delete
# this file from kustomization.yaml and point DB_HOST in configmap.yaml at
# that Service instead.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-1
  labels:
    kubernetes.io/service-name: postgres
addressType: IPv4
ports:
  - name: postgres
    port: 5432
    protocol: TCP
endpoints:
  - addresses:
      - "192.168.1.10" # <- the VM address of the PostgreSQL container
