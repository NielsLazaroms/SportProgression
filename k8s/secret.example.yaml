# Copy to secret.yaml, fill in the values and apply it. secret.yaml is in
# .gitignore: never commit real secrets.
#   cp k8s/secret.example.yaml k8s/secret.yaml
#
# Or create it straight from the command line instead:
#   kubectl -n sportprogression create secret generic backend-secrets \
#     --from-literal=DB_USER=... --from-literal=DB_PASS=... ...
#
# Random JWT secrets: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  DB_USER: sportprogression
  DB_PASS: change-me
  JWT_SECRET: change-me-long-random-string
  JWT_REFRESH_SECRET: change-me-another-long-random-string
  GOOGLE_CLIENT_ID: change-me.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: change-me
  # Leave empty to switch the AI features off.
  ANTHROPIC_API_KEY: ""
