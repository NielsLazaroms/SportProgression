# Sends all traffic for the host to the frontend; nginx in that container
# forwards /api/ to the backend, so no rewrite rules are needed here.
#
# HTTPS is required: in production the session cookies are marked Secure and
# browsers drop them on plain http, so signing in would silently fail.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sportprogression
  annotations:
    # The platform's cert-manager gets a Let's Encrypt certificate for the host.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  # k3s's Traefik, which the platform uses.
  ingressClassName: traefik
  tls:
    - hosts:
        - sportprogression.mn-platform.tech
      secretName: sportprogression-tls
  rules:
    - host: sportprogression.mn-platform.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
