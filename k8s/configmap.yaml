# Settings that are not secret. Secrets (passwords, keys) go in secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  NODE_ENV: production
  # Time zone of the API (week boundaries, timestamps), e.g. Europe/Amsterdam.
  TZ: UTC

  # The platform's shared PostgreSQL. User and password come from the
  # Secret "database" that the platform made (see backend.yaml).
  DB_HOST: postgres.platform-db.svc
  DB_PORT: "5432"
  DB_NAME: sportprogression
  DB_SSL: "false"
  # With DB_SSL=true: "false" accepts a self signed certificate.
  DB_SSL_REJECT_UNAUTHORIZED: "true"
  # Apply pending schema migrations when the API starts.
  DB_MIGRATIONS_RUN: "true"

  # Public address of the app, exactly as people type it (no trailing slash).
  FRONTEND_URL: https://sportprogression.mn-platform.tech
  # Must also be listed under "Authorised redirect URIs" in Google Cloud.
  GOOGLE_CALLBACK_URL: https://sportprogression.mn-platform.tech/api/auth/google/callback

  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d

  # Proxy hops in front of the API: Traefik + frontend nginx = 2.
  # Use 1 when people reach the frontend directly (NodePort, no ingress).
  # Too high lets clients fake their address and dodge the rate limits.
  TRUST_PROXY: "2"

  # Accounts that may use the paid AI features (comma separated, or "*").
  AI_ALLOWED_EMAILS: ""
